# Configuración de yt-dlp para Spodown Backend

# Usar Node.js como runtime de JavaScript (ya disponible en el contenedor)
--js-runtimes node

# Descargar scripts EJS desde GitHub automáticamente
--remote-components ejs:github

# Formato de salida
--no-playlist
--format bestaudio/best

# Cookies
--cookies youtube_cookies.txt

# Reintentos
--retries 5
--fragment-retries 5

# Sin colores en la salida
--no-color

# User agent
--user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
